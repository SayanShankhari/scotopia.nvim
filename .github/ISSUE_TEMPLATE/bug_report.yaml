name: Bug Report
description: Create a report to help us fix a problem or highlight error.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: input
    id: neovim-version
    attributes:
      label: Neovim Version
      placeholder: e.g. v0.10.0
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
    validations:
      required: false
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps or a minimal init code snippet to reproduce the issue.
      placeholder: |
        1. Open file of type 'X'
        2. Set colorscheme scotopia
        3. See error or visual issue
    validations:
      required: false
